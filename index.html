<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI — One AI. Unlimited Creation.</title>
  <meta name="description" content="Nexus AI is the unified AI creation platform for full-stack websites, portfolios, conversational AI, ATS resume scoring, and enterprise document RAG.">

  <!-- OpenGraph / Social Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nexus AI — One AI. Unlimited Creation.">
  <meta property="og:description" content="Generate full-stack websites, deploy developer portfolios, optimize resumes for ATS, and interrogate documents with vector RAG in one place.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00F0FF',
              blue: '#3B82F6',
              dark: '#08090C',
              card: '#131722'
            }
          }
        }
      }
    }
  </script>

  <!-- JSZip CDN for in-browser source code zip exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Canvas Confetti for milestone celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
</head>

  <div id="app-root">
    <!-- Top Navigation Header Container -->
    <header id="app-nav"></header>

    <!-- Main Dynamic View Container -->
    <main id="main-view-container" class="main-content-view"></main>

    <!-- Global Modal & Dialog Container -->
    <div id="global-modal-container"></div>
  </div>

  <!-- Application Logic Scripts (Strict Dependency Order) -->
  <script src="js/config.js"></script>

  <script src="js/modules/auth.js"></script>
  <script src="js/modules/chat.js"></script>
  <script src="js/modules/websiteGenerator.js"></script>
  <script src="js/modules/portfolioBuilder.js"></script>
  <script src="js/modules/resumeAnalyzer.js"></script>
  <script src="js/modules/ragKnowledgeBase.js"></script>
  <script src="js/modules/workspace.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
